# Releases the patched module. Go fetches a module version straight from
# its tag, so the release only marks it: applications use it with
#
#   replace github.com/tinfoilsh/tinfoil-go => github.com/digicatapult/fabai-tinfoil-go vX.Y.Z[-pre].fabai.N
#
# Tag vX.Y.Z[-pre].fabai.N on a fabai/* branch. A module at the repository
# root needs a vX.Y.Z tag, so the tag has no fabai- prefix; the .fabai.N
# suffix sorts it after the upstream release it patches. Upstream's
# "SDK Release" workflow, which also runs on v* tags, is disabled in the
# repository's settings.
name: FabAI release

on:
  push:
    tags:
      - "v*.fabai.*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\.fabai\.[0-9]+$ ]]; then
            echo "::error::tag $TAG isn't vX.Y.Z[-pre].fabai.N"
            exit 1
          fi

      - name: Only FabAI's patches differ from upstream
        run: scripts/check-fabai-diff.sh --upstream

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # Disable caching in release flows to avoid cache poisoning supply chain attacks
          cache: false

      - name: Test
        run: go test -race -p 1 ./...

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --verify-tag --prerelease --latest=false --generate-notes
